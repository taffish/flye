[package]
name = "flye"
kind = "tool"
version = "2.9.7"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/flye"

[command]
name = "taf-flye"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/flye:2.9.7-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["genome-assembly", "long-read", "metagenomics", "de-novo-assembly"]
keywords = ["Flye", "metaFlye", "PacBio", "ONT", "Nanopore", "HiFi", "long reads", "repeat graph", "assembly", "contigs", "GFA"]
description = "Flye long-read de novo assembler for PacBio and Oxford Nanopore reads, including isolate and metagenome repeat-graph assembly modes."

[upstream]
name = "Flye"
type = "github"
repo = "mikolmogorov/Flye"
homepage = "https://github.com/mikolmogorov/Flye"
manual = "https://github.com/mikolmogorov/Flye/blob/2.9.7/docs/USAGE.md"
release_url = "https://github.com/mikolmogorov/Flye/releases/tag/2.9.7"
downloads = "https://github.com/mikolmogorov/Flye/archive/refs/tags/2.9.7.tar.gz"
version = "2.9.7"
license = "BSD-3-Clause"
citation = "Kolmogorov et al. 2019; Kolmogorov et al. 2020"
doi = "10.1038/s41587-019-0072-8; 10.1038/s41592-020-00971-x"
watch = "tags"

[smoke]
backend = "docker"
timeout = 600
exist = ["flye", "flye-modules", "flye-minimap2", "flye-samtools", "python3", "bash", "gzip"]
test = ["python3 /usr/local/libexec/flye-smoke.py identity", "python3 /usr/local/libexec/flye-smoke.py assembly"]
